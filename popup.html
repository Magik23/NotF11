<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">NotF11</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="brand">
        <img
          class="brand__icon"
          src="assets/icons/icon-48.png"
          width="38"
          height="38"
          alt=""
        >
        <div>
          <h1 data-i18n="extensionName">NotF11</h1>
          <p data-i18n="appTagline">Any browser tab, toolbar-free.</p>
        </div>
      </header>

      <section
        class="settings"
        aria-label="NotF11 settings"
        data-i18n-aria-label="settingsAria"
      >
        <label class="setting" for="clean-on-launch">
          <span class="setting__copy">
            <strong data-i18n="cleanOnLaunchTitle">Clean on launch</strong>
            <small data-i18n="cleanOnLaunchDescription">Start the first browser window in Clean mode.</small>
          </span>
          <span class="switch">
            <input id="clean-on-launch" type="checkbox">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting" for="new-tabs-stay-clean">
          <span class="setting__copy">
            <strong data-i18n="newTabsStayCleanTitle">New tabs stay clean</strong>
            <small data-i18n="newTabsStayCleanDescription">New tabs opened from a Clean window also open Clean.</small>
          </span>
          <span class="switch">
            <input id="new-tabs-stay-clean" type="checkbox">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>

        <label class="setting" for="remember-window-geometry">
          <span class="setting__copy">
            <strong data-i18n="rememberGeometryTitle">Remember size &amp; position</strong>
            <small data-i18n="rememberGeometryDescription">Keep Clean windows in the same desktop footprint. Turn off for tiling window managers.</small>
          </span>
          <span class="switch">
            <input id="remember-window-geometry" type="checkbox">
            <span class="switch__track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <button id="toggle-button" class="primary" type="button">
        <span id="toggle-label" data-i18n="toggleCurrentTabDefault">Toggle current tab</span>
        <kbd id="shortcut-toggle-primary">Ctrl Shift F</kbd>
      </button>

      <section
        class="shortcuts"
        aria-label="Keyboard shortcuts"
        data-i18n-aria-label="shortcutsAria"
      >
        <div class="shortcut-row">
          <span data-i18n="toggleCleanMode">Toggle clean mode</span>
          <kbd id="shortcut-toggle">Ctrl Shift F</kbd>
        </div>
        <div class="shortcut-row">
          <span data-i18n="nextSourceTab">Next source tab</span>
          <kbd id="shortcut-next">Ctrl Shift .</kbd>
        </div>
        <div class="shortcut-row">
          <span data-i18n="previousSourceTab">Previous source tab</span>
          <kbd id="shortcut-previous">Ctrl Shift ,</kbd>
        </div>
        <button id="manage-shortcuts" class="secondary" type="button" data-i18n="manageShortcuts">
          Manage shortcuts
        </button>
        <button id="open-documentation" class="secondary" type="button" data-i18n="helpDocumentation">
          Help &amp; documentation
        </button>
      </section>

      <p
        id="message"
        class="message"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>

      <footer data-i18n="footerPrivacy">
        Live tabs. Local state. No page access.
      </footer>
    </main>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
